version: "3"

vars:
  CODE_DIR: ecommerce
  DOCKER_DIR: docker

tasks:
  install:
    desc: "Install project"
    silent: true
    cmds:
      - echo "## Installing ASDF plugins..."
      - asdf plugin add java || true
      - asdf plugin add maven || true
      - asdf plugin add quarkus || true
      - echo "✅ Asdf plugins installed successfully"
      - echo ""

      - echo "## Installing ASDF tools..."
      - asdf install
      - echo "✅ Asdf tools installed successfully"
      - echo ""

  env-up:
    desc: "Start environment"
    silent: true
    dir: "{{.DOCKER_DIR}}"
    cmds:
      - echo "## Starting environment..."
      - docker-compose up -d
      - echo "✅ Environment started successfully"
      - echo ""

  env-down:
    desc: "Stop environment"
    silent: true
    dir: "{{.DOCKER_DIR}}"
    cmds:
      - echo "## Stopping environment..."
      - docker-compose down -v
      - echo "✅ Environment stopped successfully"
      - echo ""

  build:
    desc: "Build project"
    silent: true
    dir: "{{.CODE_DIR}}"
    cmds:
      - echo "## Building project..."
      - mvn clean test
      - echo "✅ Project built successfully"
      - echo ""

  test:
    desc: "Test project"
    silent: true
    dir: "{{.CODE_DIR}}"
    cmds:
      - echo "## Testing project..."
      - mvn clean test
      - echo "✅ Project test successfully"
      - echo ""

  start:
    desc: "Start project"
    silent: true
    dir: "{{.CODE_DIR}}"
    cmds:
      - mvn clean compile quarkus:dev
